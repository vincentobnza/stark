[project]
name = "stark-ai"
version = "0.1.0"
description = "STARK speech-to-text and cloud voice service"
# Pinned to 3.12: ctranslate2 / PyAV wheels lag new CPython releases badly.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.1",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "anthropic>=0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stark_ai"]
