[package]
name = "stark"
version = "0.1.0"
description = "STARK desktop assistant"
authors = ["Vincent"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "stark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# Global media keys: keybd_event reaches the shell, unlike SendKeys which only
# reaches the focused window.
windows = { version = "0.57", features = ["Win32_UI_Input_KeyboardAndMouse"] }
